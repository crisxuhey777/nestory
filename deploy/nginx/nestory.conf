# Nestory —— 静态前端 + /api 反向代理到本机 Python 后端
# 由 deploy/install.sh 自动安装；手动安装时：
#   cp deploy/nginx/nestory.conf /etc/nginx/sites-available/nestory
#   sed -i 's/__DOMAIN__/your.domain.com/' /etc/nginx/sites-available/nestory
#   ln -sf /etc/nginx/sites-available/nestory /etc/nginx/sites-enabled/nestory

# 登录/注册限流：每 IP 每分钟 20 次，防暴力破解
limit_req_zone $binary_remote_addr zone=nestory_auth:10m rate=20r/m;

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    root /var/www/nestory;
    index index.html;

    # 整份 AppState（含照片 data URL）最大 12MB，留出余量
    client_max_body_size 20m;

    access_log /var/log/nginx/nestory.access.log;
    error_log  /var/log/nginx/nestory.error.log;

    gzip on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/manifest+json;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Vite 构建产物带内容哈希，可以长期缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 入口文件不缓存，发版后立刻生效
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # 单页应用：其余路径回落到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---- 登录 / 注册：带限流 ----
    location ~ ^/api/auth/(login|register)$ {
        limit_req zone=nestory_auth burst=10 nodelay;
        limit_req_status 429;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;

        proxy_pass http://127.0.0.1:8000;
    }

    # ---- 其余 API（AI 生成最长 45s，超时给足）----
    location /api/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;

        proxy_pass http://127.0.0.1:8000;
    }
}
